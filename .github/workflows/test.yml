name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly live-connector check — catches Remotive silently changing its
    # response shape even when nobody has touched this repo.
    - cron: "0 13 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -v
